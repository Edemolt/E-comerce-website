name: CICD
on:
  push:
    branches: 
      - deploy-to-ec2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
      - name: Login to DockerHub
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build Docker Image
        run: docker build -t demolt/crown-clothing .
      - name: Publish image to DockerHub
        run: docker push demolt/crown-clothing:latest

  deploy:
    needs: build
    runs-on: ip-172-31-9-119
    steps: 
      - name: Pull img from DockerHub
        run: docker pull demolt/crown-clothing:latest
      - name: Delete old container
        run: docker rm -f reactContainer
      - name: Run the docker container
        run: docker run -d -p 3000:80 --name reactContainer demolt/crown-clothing:latest